     max-lifetime: 1200000

  jpa:
   hibernate:
    ddl-auto: update
   show-sql: true
   properties:
    hibernate:
     dialect: org.hibernate.dialect.MySQL8Dialect
    format_sql: true
    use_sql_comments: true
    generate_statistics: true

  sql:
    init:
      mode: never
      data-locations: classpath:data.sql
    jpa:
      defer-datasource-initialization: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB


